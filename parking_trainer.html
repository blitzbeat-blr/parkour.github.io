<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1013">
<title>Тренажёр парковки</title>
<style>
:root{--acc:#ff7a1a;--ok:#3ddc84;--warn:#ffcc33;--bad:#ff4d4d;--tx:#f2f4f7;--mu:#98a1ab;--glass:rgba(16,18,22,.74)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e1013;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--tx)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#view{position:relative;flex:1 1 auto;min-height:0;min-width:0;overflow:hidden;background:#3c3f44}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
/* ---------- HUD ---------- */
.ib{width:40px;height:40px;border-radius:12px;background:var(--glass);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .08s}
.ib:active{transform:scale(.92)}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib.off svg{stroke:#7b838c}
.ib.off{opacity:.8}
#top{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;align-items:center;gap:8px;pointer-events:none;z-index:25}
#top>*{pointer-events:auto}
#nav{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;justify-content:center}
#ttl{min-width:0;max-width:280px;flex:0 1 auto;text-align:center;background:var(--glass);border-radius:12px;padding:5px 12px 6px;
  box-shadow:0 2px 10px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
#tNum{font-size:11px;color:var(--mu);font-weight:700;letter-spacing:.06em;white-space:nowrap}
#tNum b{color:var(--acc)}
#tName{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side{position:absolute;right:10px;top:calc(58px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px;z-index:25}
body.modal #side,body.carding #side{display:none}
#side .ib{width:var(--sb,72px);height:var(--sb,72px);border-radius:calc(var(--sb,72px) * .25)}
#side .ib svg{width:calc(var(--sb,72px) * .55);height:calc(var(--sb,72px) * .55);stroke-width:2}
#side .ib.act{box-shadow:0 0 0 3px var(--acc),0 2px 10px rgba(0,0,0,.35)}
#side .ib.act svg{stroke:var(--acc)}
#chips{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;pointer-events:none}
.chip{background:var(--glass);border-radius:9px;padding:4px 8px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);white-space:nowrap}
.chip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chip.bad{color:#ff8a80}
#stat{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:92%;text-align:center;font-size:14px;font-weight:800;
  padding:7px 14px;border-radius:12px;background:var(--glass);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);opacity:0;transition:opacity .2s;pointer-events:none}
#stat.on{opacity:1}
#stat.ok{color:#7cf0ac;box-shadow:inset 0 0 0 1.5px rgba(61,220,132,.7)}
#stat.warn{color:#ffd76a;box-shadow:inset 0 0 0 1.5px rgba(255,204,51,.6)}
#stat.plan{color:#fff;font-size:12.5px;line-height:1.35;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);display:flex;align-items:center;gap:7px;
  width:max-content;max-width:calc(100% - 20px);text-align:left;padding:6px 10px}
#stat.plan .nb{flex:0 0 22px;width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0d1a12}
#stat.plan .gc{flex:0 0 auto;min-width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;background:#14161a;box-shadow:inset 0 0 0 1.5px currentColor}
#stat.plan>span:last-child{flex:1 1 auto;min-width:0}
#toast{position:absolute;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translate(-50%,-8px);font-size:14px;font-weight:800;
  padding:8px 14px;border-radius:12px;background:rgba(18,20,24,.9);opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;
  white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:rgba(190,40,35,.94)}
#toast.ok{background:rgba(25,140,80,.94)}
#demoBar{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);display:none;align-items:center;gap:10px;
  background:rgba(255,122,26,.95);color:#1a0d02;font-weight:900;font-size:13px;padding:6px 6px 6px 12px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#demoBar button{background:#1a0d02;color:#fff;border-radius:8px;padding:5px 10px;font-weight:800;font-size:12px}
#demoBar.on{display:flex}
/* ---------- panel ---------- */
#panel{position:relative;flex:0 0 auto;height:clamp(218px,37vh,330px);display:flex;align-items:stretch;justify-content:space-between;gap:4px;
  padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:radial-gradient(120% 90% at 50% 100%,#23262c 0%,#15171b 55%,#0d0e11 100%);
  border-top:1px solid rgba(255,255,255,.06);box-shadow:0 -10px 28px rgba(0,0,0,.5)}
#pl,#pr{flex:0 0 auto;width:clamp(76px,23vw,112px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px}
#pl{justify-content:flex-start}
#pc{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
#pc>*,#pl>*,#pr>*{flex-shrink:0}
.lbl{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;text-align:center}
/* gear selector */
#gearbox{position:relative;width:64px;height:var(--gbh,164px);border-radius:15px;background:linear-gradient(#23262b,#141619);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.05),0 1px 0 rgba(255,255,255,.05);touch-action:none}
#gearbox .sl{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:var(--gf,24px);color:#5c636c}
#gearbox .sl::before{content:"";position:absolute;inset:4px 5px;border-radius:12px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
#knob{position:absolute;left:5px;right:5px;border-radius:12px;background:linear-gradient(#6a707a,#2c3036 60%,#24272c);
  box-shadow:0 5px 12px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.4);transition:top .14s cubic-bezier(.3,1.4,.6,1);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:var(--gk,28px);color:#fff;pointer-events:none}
#knob.P{color:#ff6b5f}#knob.R{color:#fff}#knob.D{color:#7cf0ac}
#gearbox.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
/* handbrake */
#hand{position:relative;width:62px;height:56px;border-radius:14px;background:linear-gradient(#202328,#121417);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.05);touch-action:none}
#hand .lev{position:absolute;left:10px;right:10px;bottom:13px;height:12px;border-radius:7px;background:linear-gradient(#5c626b,#2a2e34);
  transform-origin:12% 50%;transform:rotate(0deg);transition:transform .16s;box-shadow:0 3px 6px rgba(0,0,0,.5)}
#hand .lev::after{content:"";position:absolute;right:-2px;top:-2px;width:14px;height:16px;border-radius:5px;background:#1a1c20}
#hand.on .lev{transform:rotate(-30deg)}
#hand .ico{position:absolute;right:6px;top:5px;font-size:10px;font-weight:900;color:#4b2a2a;border:2px solid #4b2a2a;border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center}
#hand.on .ico{color:#ff4d4d;border-color:#ff4d4d;box-shadow:0 0 10px rgba(255,77,77,.6)}
/* pedals */
#pedals{display:flex;align-items:flex-end;gap:7px}
.pedal{position:relative;border-radius:10px;background:linear-gradient(#3a3e45,#1c1e22);box-shadow:0 6px 0 #0b0c0e,0 8px 14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .06s,box-shadow .06s;transform-origin:50% 100%;touch-action:none}
.pedal i{position:absolute;inset:6px;border-radius:6px}
#pGas{width:72px;height:130px}
#pGas i{background:repeating-linear-gradient(90deg,#15171a 0 5px,#2b2f35 5px 10px)}
#pGas .arr{position:absolute;left:50%;top:14%;width:0;height:0;margin-left:-9px;border-left:9px solid transparent;border-right:9px solid transparent;
  border-bottom:12px solid rgba(124,240,172,.55);transition:border-color .1s}
#pGas.on .arr{border-bottom-color:#7cf0ac}
.pedal.on{transform:perspective(260px) rotateX(22deg) translateY(4px);box-shadow:0 2px 0 #0b0c0e,0 3px 6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)}
#pGas.on{box-shadow:0 2px 0 #0b0c0e,0 0 16px rgba(80,230,140,.45)}
/* dash + wheel */
#dash{display:flex;align-items:center;gap:10px;background:#07080a;border-radius:10px;padding:3px 10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
#dGear{font-size:18px;font-weight:900;width:16px;text-align:center}
#dGear.P{color:#ff6b5f}#dGear.R{color:#fff}#dGear.N{color:#ffd76a}#dGear.D{color:#7cf0ac}
#dSpd{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
#dSpd small{font-size:10px;color:var(--mu);margin-left:3px;font-weight:700}
#lHand{font-size:9px;font-weight:900;color:#3a2222;border:1.6px solid #3a2222;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
#lHand.on{color:#ff4d4d;border-color:#ff4d4d;box-shadow:0 0 8px rgba(255,77,77,.7)}
#steer{position:relative;width:min(100%,190px);height:16px}
#steer .tr{position:absolute;left:0;right:0;top:6px;height:4px;border-radius:2px;background:linear-gradient(90deg,#ff7a1a 0%,#3a3f46 22%,#3a3f46 78%,#ff7a1a 100%)}
#steer .tk{position:absolute;top:3px;width:2px;height:10px;margin-left:-1px;background:#596069;border-radius:1px}
#steer .c0{background:#c9ced4;height:12px;top:2px}
#steer .mk{position:absolute;top:0;width:10px;height:16px;margin-left:-5px;border-radius:4px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
#steer .mk.lock{background:var(--acc);box-shadow:0 0 10px rgba(255,122,26,.9)}
#steerTxt{font-size:10px;font-weight:800;color:var(--mu);letter-spacing:.04em;min-height:12px;white-space:nowrap}
#wheelWrap{position:relative;width:var(--wd,190px);height:var(--wd,190px);touch-action:none;flex:0 0 auto}
#wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 12px rgba(0,0,0,.6))}
#wheelWrap.lock{animation:lockj .18s}
@keyframes lockj{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
/* coach (tutorial pointer) */
#coach{position:fixed;pointer-events:none;border-radius:16px;box-shadow:0 0 0 3px var(--acc),0 0 0 9999px rgba(0,0,0,0);display:none;z-index:30;animation:cpulse 1s infinite}
#coach.on{display:block}
@keyframes cpulse{0%,100%{box-shadow:0 0 0 3px rgba(255,122,26,1),0 0 18px 4px rgba(255,122,26,.6)}50%{box-shadow:0 0 0 6px rgba(255,122,26,.5),0 0 26px 8px rgba(255,122,26,.3)}}
/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:70px 14px 14px;z-index:20}
.ov.on{display:flex}
.ov.dim{background:rgba(8,9,11,.55)}
#ovCard{align-items:flex-end;padding-bottom:12px;pointer-events:none}
#ovCard .card{pointer-events:auto}
.card{width:min(100%,360px);max-height:100%;overflow:auto;background:linear-gradient(#20242a,#16191d);border-radius:20px;padding:18px 18px 16px;
  box-shadow:0 18px 50px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08);text-align:center}
.card h2{margin:4px 0 2px;font-size:22px;font-weight:900;letter-spacing:-.01em}
.card .k{font-size:12px;font-weight:800;color:var(--acc);letter-spacing:.08em;text-transform:uppercase}
.card .p{font-size:13px;color:var(--mu);margin:2px 0 10px;line-height:1.35}
.card .goal{font-size:14px;line-height:1.4;margin:8px 0 12px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.05);text-align:left}
.card .goal b{color:#ffd76a}
.row{display:flex;gap:8px;justify-content:center;margin-top:10px}
.btn{flex:1 1 0;height:46px;border-radius:13px;font-weight:900;font-size:15px;background:#2b3037;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 3px 0 #111;transition:transform .07s}
.btn:active{transform:translateY(2px)}
.btn.pri{background:linear-gradient(#ff9442,#f26a0c);color:#1b0c00;box-shadow:0 3px 0 #9c4106,0 8px 18px rgba(255,122,26,.3)}
.btn.sm{height:38px;font-size:13px}
.stars{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}
.stars svg{width:44px;height:44px}
.stars .st{fill:#3a3f46;transform:scale(.6);transition:transform .35s cubic-bezier(.3,1.6,.5,1),fill .2s}
.stars .st.on{fill:#ffcc33;transform:scale(1)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 4px;text-align:left}
.stats div{background:rgba(255,255,255,.05);border-radius:10px;padding:7px 9px;font-size:12px;color:var(--mu);font-weight:700}
.stats b{display:block;color:var(--tx);font-size:16px;font-weight:900}
.stats .bad b{color:#ff8a80}.stats .ok b{color:#7cf0ac}
#hMap{display:block;width:100%;height:210px;border-radius:14px;margin:10px 0 6px;background:#2a2d31;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.legend{display:flex;gap:12px;justify-content:center;font-size:11px;font-weight:800;color:var(--mu);margin-bottom:6px}
.legend i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle}
.steps{display:flex;flex-direction:column;gap:6px;text-align:left}
.step{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.05);border-radius:12px;padding:7px 9px;font-size:13.5px;line-height:1.3}
.step .nb{flex:0 0 auto;width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#0d1a12}
.step .gc{flex:0 0 auto;min-width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;background:#14161a;box-shadow:inset 0 0 0 1.5px currentColor}
.step svg.wh{flex:0 0 auto;width:26px;height:26px}
.step .tx{flex:1 1 auto}
.step .tx b{color:#fff}
details.tips{margin-top:8px;text-align:left}
details.tips summary{font-size:13px;font-weight:800;color:var(--mu);cursor:pointer;padding:4px 2px}
ol.hints{text-align:left;margin:8px 0 6px;padding-left:22px;font-size:14px;line-height:1.45}
ol.hints li{margin:4px 0}
.ctl{font-size:12.5px;color:var(--mu);text-align:left;line-height:1.5;margin:6px 0 0}
.ctl b{color:var(--tx)}
#menu .card{width:min(100%,560px);text-align:left}
#grid{margin-top:8px}
#grid .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
#grid .sec{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:900;color:#c9ced4;margin:14px 2px 7px;scroll-margin-top:6px}
#grid .sec .sg{color:#ffcc33;font-size:12px}
#grid .jump{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
#grid .jb{font-size:12px;font-weight:800;padding:6px 9px;border-radius:9px;background:#2b3037;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.tile{position:relative;height:74px;border-radius:12px;background:#252a31;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px}
.tile.cur{box-shadow:inset 0 0 0 2px var(--acc)}
.tile .n{font-size:15px;font-weight:900}
.tile svg.ic{width:26px;height:20px;fill:none;stroke:#aab2bc;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .ss{font-size:10px;letter-spacing:1px;color:#3e444c}
.tile .ss i{font-style:normal}
.tile .ss i.on{color:#ffcc33}
.mh{display:flex;align-items:center;justify-content:space-between}
.mh h2{margin:0}
.x{width:36px;height:36px;border-radius:10px;background:#2b3037;display:flex;align-items:center;justify-content:center}
.x svg{width:18px;height:18px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
@media (orientation:landscape) and (max-height:540px){
  #app{flex-direction:row}
  #panel{height:auto;width:clamp(330px,46vw,480px);border-top:0;border-left:1px solid rgba(255,255,255,.06);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  #pl,#pr{width:86px}
}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="cv"></canvas>
    <div id="top">
      <button class="ib" id="bMenu" aria-label="levels"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
      <div id="nav">
        <button class="ib" id="bPrev" aria-label="prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div id="ttl"><div id="tNum"></div><div id="tName"></div></div>
        <button class="ib" id="bNext" aria-label="next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <div id="side">
      <button class="ib" id="bRestart" aria-label="restart"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4 4v4.5h4.5"/></svg></button>
      <button class="ib" id="bHint" aria-label="help"><svg viewBox="0 0 24 24"><path d="M9.2 9a2.9 2.9 0 1 1 4.1 2.6c-.8.4-1.3 1.1-1.3 2v.6"/><path d="M12 17.6v.1"/><circle cx="12" cy="12" r="9.2"/></svg></button>
      <button class="ib" id="bGuide" aria-label="path"><svg viewBox="0 0 24 24"><path d="M6 21c0-7 3-11 9-14"/><path d="M11 21c0-5 2-8 7-10.5"/><path d="M15 4l3 2.6-3.4 1.6"/></svg></button>
      <button class="ib" id="bSound" aria-label="sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w1" d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path class="w2" d="M18 6.8a7.4 7.4 0 0 1 0 10.4"/><path class="mx" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
    </div>
    <div id="demoBar"><span id="demoTxt"></span><button id="bDemoStop"></button></div>
    <div id="toast"></div>
    <div id="stat"></div>
    <div id="chips">

    else if (/^[prdPRD]$/.test(k)) { if (state === 'card') startPlay(); started(); requestGear(k.toUpperCase()); }
    else if (k === 'Enter') { if (state === 'card') startPlay(); else if (state === 'win') loadLevel(idx + 1); else if (state === 'fail') restart(); }

/* ------------------------------------------------------------------ demo (planner solution playback) */
function startDemo() {
  var sol = PK.SOL && PK.SOL[idx + 1];

  var p = PK.startPose(lv), poses = [{ x: p.x, y: p.y, th: p.th, dir: sol.segs[0][0], st: sol.segs[0][1], s: 0 }], s = 0;
  sol.segs.forEach(function (sg) {
    var n = M.max(1, M.round(sg[2] / 0.02)), ds = sg[2] / n;
    for (var i = 0; i < n; i++) { PK.advance(p, sg[0] * ds, sg[1] * CAR.maxSteer); s += ds; poses.push({ x: p.x, y: p.y, th: p.th, dir: sg[0], st: sg[1], s: s }); }
  });

  state = 'demo'; cam.intro = 1;
  $('demoTxt').textContent = S.demoTxt; $('bDemoStop').textContent = S.stop;
  $('demoBar').classList.add('on');
}

  resetAttempt(); state = 'play';
}
function steerTowards(target, rate, dt) {
  var d = target - car.steer, s = rate * dt;

  return M.abs(target - car.steer) < 1;
}
function demoUpdate(dt) {
  var D = demo; D.t += dt;

    brakeOn = true;
    if (D.t > 0.5 && car.hand) { car.hand = false; AU.play('hand'); updHandUI(); }
    if (D.t > 0.9) { D.ph = 'shift'; D.t = 0; }
  } else if (D.ph === 'shift') {
    brakeOn = true;
    var run = D.runs[D.r], g = run.dir > 0 ? 'D' : 'R';
    if (car.gear !== g && D.t > 0.25) { car.gear = g; AU.play('gear'); updGearUI(); }
    var tgt = D.poses[run.a + 1].st * CAR.wheelMax;
    var ok = steerTowards(tgt, 520, dt);
    if (D.t > 0.55 && ok) { D.ph = 'drive'; D.t = 0; D.i = run.a; D.v = 0; D.d = D.poses[run.a].s; }
  } else if (D.ph === 'drive') {

}

/* ------------------------------------------------------------------ tutorial coach (scenario 1) */

          document.querySelector('#gearbox .sl[data-g="P"]'), $('hand')][i];
}

}

}

  var el = coachTarget(coach.i); if (!el) return;

/* ------------------------------------------------------------------ status line */

/* ------------------------------------------------------------------ main loop */
var lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);

  var dt = lastTs ? M.min(0.05, M.max(0, (ts - lastTs) / 1000)) : 1 / 60;
  lastTs = ts;

  draw(dt);
}
function update(dt) {
  time += dt;

    physics(dt);
    if (st.started) st.t += dt;
  } else if (state === 'demo') demoUpdate(dt);
  inTgt = PK.inTarget(lv, car.x, car.y, car.th, false);
  if (state === 'play') {
    if (lv.finish === 'park') { if (inTgt && car.gear === 'P' && car.hand) win(); }

  }

    var h = PK.predict(world, car.x, car.y, car.th, guideDir, PK.steerToDelta(car.steer), 4.0, PK.GUIDE_STEP, guidePts);
    if (h) guideHit = (h.stop || h.bound || (h.wheel && !h.pen)) ? 1 : 2;
    else guideHit = 0;
  }

  if (grp >= 0 && (state === 'play' || state === 'demo')) for (var i = grp * 4; i < grp * 4 + 4; i++) dmin = M.min(dmin, sens[i]);
  AU.sensor(dmin, dt);
  AU.engine(state !== 'card' || true, car.thr, car.v);
  // HUD
  updWheelUI();
  updGearUI();
  var kmh = M.round(M.abs(car.v) * 3.6);
  var sp = $('dSpd');
  if (sp._v !== kmh) { sp._v = kmh; sp.firstChild.nodeValue = kmh; sp.lastChild.textContent = S.kmh; }
  chip('cTime', fmtT(st.t)); chip('cHits', st.hits + '/3', st.hits > 0); chip('cMoves', S.moves.toLowerCase() + ' ' + st.moves);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').className = ''; }
  coachUpdate(dt);

  // effects

    var s = fx.sparks[k]; s.t -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.92; s.vy *= 0.92;

function draw() {

    ctx.globalCompositeOperation = 'lighter';
